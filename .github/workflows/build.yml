# Builds unsigned installers (no signing assets on CI). Trigger manually or on a version tag.
# Signed + notarized Mac releases are built and uploaded from a Mac with
# `node scripts/build-mac.mjs --release` (DEVELOPMENT.md §6); creating that release
# pushes the v<version> tag, which runs this and adds the Windows installer to it.
name: build
# (배포는 release.yml이 해요. 이건 손으로 돌리는 서명 없는 확인용 빌드예요.)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # prepare-target fetches the other CPU's native packages, so one Mac runner builds both
          - { os: macos-15, target: darwin-x64, args: '--mac --x64' } # Intel
          - { os: macos-15, target: darwin-arm64, args: '--mac --arm64' } # Apple Silicon
          - { os: windows-latest, target: win32-x64, args: '--win --x64' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # some unit tests run FFmpeg: this machine's copy
      - run: node scripts/fetch-binaries.mjs
      - run: npm test
      # the HyperFrames registry the app ships (scripts/fetch-registry.mjs), kept between runs
      - uses: actions/cache@v4
        with:
          path: resources/hf-registry
          key: hf-registry-${{ hashFiles('package-lock.json', 'scripts/fetch-registry.mjs') }}
      - run: node scripts/fetch-registry.mjs
      - run: npm run build
      # the regular build carries none of the 관제용 판's code (that one is built on the console's Mac)
      - run: node scripts/check-regular-build.mjs
      - run: node scripts/prepare-target.mjs --target ${{ matrix.target }}
      - run: node scripts/fetch-binaries.mjs --target ${{ matrix.target }}
      - run: npx electron-builder --config electron-builder.config.cjs ${{ matrix.args }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: motion-studio-${{ matrix.target }}
          path: |
            release/*.dmg
            release/*.exe
          if-no-files-found: error
      # Windows installer + auto-update info (latest.yml) onto the release of this version
      - name: Publish Windows installer
        if: matrix.target == 'win32-x64'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(node -p "require('./package.json').version")
          files="release/MotionStudio-Setup-$v-x64.exe release/MotionStudio-Setup-$v-x64.exe.blockmap release/latest.yml"
          ls -l $files
          if gh release view "v$v" >/dev/null 2>&1; then gh release upload "v$v" $files --clobber
          else gh release create "v$v" $files --title "모션스튜디오 $v" --notes "모션스튜디오 $v"; fi
